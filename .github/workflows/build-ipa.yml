name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode project
      working-directory: ios
      run: xcodegen generate

    - name: Build for device
      working-directory: ios
      run: |
        set -o pipefail
        xcodebuild build \
          -project PikPakClient.xcodeproj \
          -scheme PikPakClient \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY=""

    - name: Package IPA
      working-directory: ios
      run: |
        mkdir -p build/ipa/Payload
        cp -r "build/Build/Products/Release-iphoneos/PikPakClient.app" build/ipa/Payload/
        cd build/ipa
        zip -r PikPakClient.ipa Payload
        ls -la PikPakClient.ipa

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: PikPakClient-IPA
        path: ios/build/ipa/PikPakClient.ipa
        retention-days: 30
